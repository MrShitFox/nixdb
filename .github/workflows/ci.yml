name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-checks:
    name: Formatting, CLI, module, and secret checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Check formatting
        run: nix fmt -- --check $(git ls-files '*.nix')
      - name: Run flake checks
        run: nix flake check --print-build-logs
      - name: Secret sanity check
        run: bash tests/no-secrets.sh .

  vm-integration:
    name: Optional NixOS VM integration
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Build and run NixOS VM integration test
        run: nix build .#vm-integration-test --no-link --print-build-logs
